<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Slides · Lumina Docs</title>
  <link rel="stylesheet" href="./slides.css">
  <link rel="stylesheet" href="./research-tools.css">
  <script src="./vendor/jszip-3.10.1.min.js" defer></script>
  <script src="./vendor/pptxgen-3.12.0.min.js" defer></script>
  <script src="./library-store.js" defer></script>
  <script src="./slide-canvas.js" defer></script>
  <script src="./slide-canvas-ui.js" defer></script>
  <script src="./research-tools.js" defer></script>
  <script src="./research-ui.js" defer></script>
  <script src="./slides.js" defer></script>
  <link rel="stylesheet" href="./lumina-design.css">
  <script src="./vendor/lucide-1.79.0.min.js" defer></script>
  <script src="./lumina-design.js" defer></script>
</head>
<body class="lumina-app lumina-slides">
  <header class="lumina-shell">
  <div class="lumina-shell-inner">
    <a class="lumina-brand" href="./" aria-label="Lumina Docs home"><span class="lumina-mark" aria-hidden="true">L</span>Lumina Docs</a>
    <nav class="lumina-nav" aria-label="App navigation">
      <a href="./workspace.html"><i data-lucide="layout-grid" aria-hidden="true"></i>Workspace</a>
      <a href="./docs.html"><i data-lucide="file-text" aria-hidden="true"></i>Docs</a>
      <a href="./slides.html" aria-current="page"><i data-lucide="presentation" aria-hidden="true"></i>Slides</a>
      <a href="./pdf-tools.html"><i data-lucide="files" aria-hidden="true"></i>PDF Tools</a>
    </nav>
  </div>
</header>
  <header class="topbar">
    <label class="deck-name">Presentation <input id="deck-title" maxlength="100" value="Untitled presentation"></label>
    <div class="actions"><button id="present" class="primary">Present</button><button id="export">Export PowerPoint</button></div>
  </header>
  <main class="workspace">
    <aside class="sidebar" aria-label="Slide list">
      <div class="panel-title"><h1>Slides</h1><button id="add">+ Add slide</button></div>
      <ol id="slide-list"></ol>
      <div class="slide-actions">
        <button id="up" aria-label="Move slide up">↑</button>
        <button id="down" aria-label="Move slide down">↓</button>
        <button id="duplicate">Duplicate</button>
        <button id="remove">Delete</button>
      </div>
    </aside>
    <section class="stage" aria-label="Slide canvas">
      <div id="canvas" class="slide"></div>
      <p id="save-status" role="status"></p>
      <label class="notes">Speaker notes<textarea id="notes" rows="3" maxlength="5000" placeholder="What will you say on this slide?"></textarea></label>
    </section>
    <section class="inspector" aria-label="Slide settings">
      <h2>Edit slide</h2>
      <label>Title <input id="slide-title" maxlength="180"></label>
      <label id="body-controls">Content <textarea id="slide-body" rows="5" maxlength="3000"></textarea></label>
      <div class="options">
        <label>Layout
          <select id="layout"><option value="cover">Title slide</option><option value="text">Title and text</option><option value="bullets">Bullet list</option><option value="image">Text and image</option><option value="freeform">Freeform canvas</option></select>
        </label>
        <label>Theme
          <select id="theme"><option value="ink">Midnight</option><option value="paper">Paper</option><option value="forest">Forest</option><option value="coral">Coral</option></select>
        </label>
        <label>Transition into slide
          <select id="transition"><option value="none">None</option><option value="fade">Fade</option><option value="push">Push left</option><option value="wipe">Wipe left</option></select>
        </label>
        <label>Speed
          <select id="speed"><option value="fast">Fast</option><option value="med">Medium</option><option value="slow">Slow</option></select>
        </label>
      </div>
      <div id="image-controls" hidden>
        <label>Slide image <input id="image-file" type="file" accept="image/png,image/jpeg"></label>
        <label>Image description <input id="image-description" maxlength="250"></label>
        <button id="clear-image">Remove image</button>
      </div>
      <section id="freeform-controls" hidden>
        <h3>Canvas objects</h3>
        <div id="object-additions" class="file-actions">
          <button id="add-text">Add text</button><button id="add-rectangle">Add rectangle</button><button id="add-ellipse">Add ellipse</button>
          <label class="file-button">Add image<input id="add-object-image" type="file" accept="image/jpeg,image/png"></label>
        </div>
        <label id="object-picker-label" hidden>Selected object<select id="object-picker"></select></label>
        <p class="canvas-help">Drag an object or focus it and use the arrow keys.</p>
        <div id="object-fields" hidden>
          <label id="object-description"><span id="object-text-label">Text</span><textarea id="object-text" rows="3" maxlength="1200"></textarea></label>
          <div class="options">
            <label id="object-color-label">Color<input type="color" id="object-color"></label>
            <label id="object-size-label">Font size<input type="number" id="object-size" min="12" max="72"></label>
            <label>Left (%)<input type="number" id="object-x" min="0" max="95" step="0.1"></label>
            <label>Top (%)<input type="number" id="object-y" min="0" max="95" step="0.1"></label>
            <label>Width (%)<input type="number" id="object-w" min="5" max="100" step="0.1"></label>
            <label>Height (%)<input type="number" id="object-h" min="5" max="100" step="0.1"></label>
          </div>
          <div class="file-actions"><button id="object-front">Bring forward</button><button id="object-back">Send back</button><button id="object-copy">Duplicate object</button><button id="object-delete">Remove object</button></div>
        </div>
      </section>
      <label>New slide template
        <select id="template"><option value="title">Title and subtitle</option><option value="comparison">Two-column comparison</option><option value="quote">Quotation</option></select>
      </label>
      <button id="apply-template">Insert template slide</button>
      <button id="add-research-chart">Insert chart from CSV</button>
      <button id="apply-theme">Apply theme to all slides</button>
      <div class="file-actions"><button id="backup">Save editable copy</button><label class="file-button">Open editable copy<input type="file" id="restore" accept=".json,application/json"></label></div>
    </section>
  </main>
  <dialog id="show" aria-label="Slide presentation">
    <div id="show-slide" class="slide"></div>
    <nav class="show-controls" aria-label="Presentation controls">
      <button id="previous">Previous</button><span id="counter" aria-live="polite"></span><button id="next">Next</button><button id="toggle-notes" aria-expanded="false">Notes</button><button id="exit">Exit</button>
    </nav>
    <p id="present-notes" hidden></p>
  </dialog>
</body>
</html>
