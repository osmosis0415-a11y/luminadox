<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Workspace · Lumina Docs</title>
  <link rel="stylesheet" href="./workspace.css">
  <script src="./lumina-storage.js" defer></script>
  <script src="./library-store.js" defer></script>
  <script src="./workspace.js" defer></script>
  <link rel="stylesheet" href="./lumina-design.css">
  <script src="./vendor/lucide-1.79.0.min.js" defer></script>
  <script src="./lumina-design.js" defer></script>
</head>
<body class="lumina-app lumina-workspace">
  <header class="lumina-shell">
  <div class="lumina-shell-inner">
    <a class="lumina-brand" href="./" aria-label="Lumina Docs home"><span class="lumina-mark" aria-hidden="true">L</span>Lumina Docs</a>
    <nav class="lumina-nav" aria-label="App navigation">
      <a href="./workspace.html" aria-current="page"><i data-lucide="layout-grid" aria-hidden="true"></i>Workspace</a>
      <a href="./docs.html"><i data-lucide="file-text" aria-hidden="true"></i>Docs</a>
      <a href="./slides.html"><i data-lucide="presentation" aria-hidden="true"></i>Slides</a>
      <a href="./pdf-tools.html"><i data-lucide="files" aria-hidden="true"></i>PDF Tools</a>
    </nav>
  </div>
</header>
  <main class="workspace-screen">
    <section class="workspace-hero" aria-labelledby="workspace-title">
    <h1 id="workspace-title" class="screen-title">Workspace</h1>
    <p class="screen-intro">Create or reopen documents, slide decks, and PDFs on this device.</p>
    <nav aria-label="Create or import" class="workspace-create">
      <a href="./docs.html?new=blank"><i data-lucide="file-plus" aria-hidden="true"></i>New document</a>
      <a href="./docs.html?new=thesis"><i data-lucide="graduation-cap" aria-hidden="true"></i>New thesis</a>
      <button id="new-deck"><i data-lucide="presentation" aria-hidden="true"></i>New slide deck</button>
      <label class="file-button"><i data-lucide="file-up" aria-hidden="true"></i>Add PDFs<input id="pdfs" type="file" accept=".pdf,application/pdf" multiple></label>
    </nav>
    </section>
    <section class="workspace-library" aria-labelledby="library-title">
    <h2 id="library-title">Your files</h2>
    <p><a href="./data.html">Open data workspace</a></p>
    <div class="filters">
      <label>Search files<input id="search" type="search" placeholder="Title, folder, or tags"></label>
      <label>File type<select id="type"><option value="">All files</option><option value="doc">Documents</option><option value="slide">Slide decks</option><option value="pdf">PDFs</option></select></label>
      <label>Folder<select id="folder"><option value="">All folders</option></select></label>
      <label>Sort<select id="sort"><option value="recent">Most recent</option><option value="title">Title</option></select></label>
      <label class="check"><input id="favorites" type="checkbox"> Favorites</label>
    </div>
    <p id="status" role="status"></p>
    <ul id="files" aria-label="Workspace files"></ul>
    </section>
  </main>
  <dialog id="settings">
    <form id="settings-form">
      <h2 id="settings-title">Organize file</h2>
      <label>Folder<input id="edit-folder" maxlength="100"></label>
      <label>Tags<input id="edit-tags" maxlength="240" placeholder="Separate tags with commas"></label>
      <label class="check"><input id="edit-favorite" type="checkbox"> Favorite</label>
      <div class="tools"><button type="submit">Save</button><button type="button" id="cancel-settings">Cancel</button></div>
    </form>
  </dialog>
  <dialog id="history">
    <section>
      <h2>Version history</h2>
      <p>Save a named checkpoint or open an earlier checkpoint as a new copy.</p>
      <form id="version-form">
        <label>Version name<input id="version-name" maxlength="80" required></label>
        <button type="submit">Save checkpoint</button>
      </form>
      <ul id="versions"></ul>
      <button id="close-history">Close</button>
    </section>
  </dialog>
</body>
</html>
