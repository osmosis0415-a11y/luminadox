<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net 'wasm-unsafe-eval'; worker-src 'self' blob: https://cdn.jsdelivr.net; connect-src 'self' https://cdn.jsdelivr.net; img-src 'self' data: blob:; style-src 'self'; font-src 'self' blob: data:; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Organize PDF · Lumina Docs</title>
  <link rel="stylesheet" href="./organize-pdf.css">
  <script defer src="./library-store.js"></script>
  <script defer src="./vendor/pdf-lib-1.17.1.min.js"></script>
  <script defer src="./organize-pdf.js"></script>
  <link rel="stylesheet" href="./lumina-design.css?v=readable-1">
  <script src="./vendor/lucide-1.79.0.min.js" defer></script>
  <script src="./lumina-design.js" defer></script>
</head>
<body class="lumina-app lumina-organize">
  <header class="lumina-shell">
  <div class="lumina-shell-inner">
    <a class="lumina-brand" href="./" aria-label="Lumina Docs home"><span class="lumina-mark" aria-hidden="true">L</span>Lumina Docs</a>
    <nav class="lumina-nav" aria-label="App navigation">
      <a href="./workspace.html"><i data-lucide="layout-grid" aria-hidden="true"></i>Workspace</a>
      <a href="./docs.html"><i data-lucide="file-text" aria-hidden="true"></i>Docs</a>
      <a href="./slides.html"><i data-lucide="presentation" aria-hidden="true"></i>Slides</a>
      <a href="./pdf-tools.html" aria-current="page"><i data-lucide="files" aria-hidden="true"></i>PDF Tools</a>
    </nav>
  </div>
</header>
  <main>
    <section class="organizer-intro">
      <h1 class="screen-title">Organize PDF pages</h1>
      <p class="screen-intro">Drag pages or use the move buttons to reorder them. You’ll download a new PDF. Removing pages can discard bookmarks and interactive forms.</p>
    </section>
    <label class="file-picker">Choose a PDF <input id="source-file" type="file" accept=".pdf,application/pdf"></label>
    <p id="document-name"></p>
    <fieldset id="controls" disabled>
      <legend>Page actions</legend>
      <button id="select-all">Select all</button>
      <button id="rotate">Rotate selected</button>
      <button id="delete">Remove selected</button>
      <button id="undo">Undo</button>
      <button id="export" class="primary">Download PDF</button>
    </fieldset>
    <p id="status" role="status"></p>
    <ol id="pages" aria-label="PDF page order"></ol>
  </main>
</body>
</html>
