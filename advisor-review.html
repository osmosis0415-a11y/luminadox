<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Advisor review · Lumina Docs</title>
<link rel="stylesheet" href="./lumina-design.css?v=readable-1"><link rel="stylesheet" href="./workspace.css"><script src="./advisor-review.js" defer></script></head>
<body class="lumina-app"><header><a href="./docs.html">Docs</a><a href="./workspace.html">Workspace</a></header><main>
<h1>Advisor review</h1><p>Open a review copy from Lumina Docs. Feedback is downloaded as a separate file so the author can import it without replacing their draft.</p>
<label>Open review copy <input id="review-copy" type="file" accept=".json,application/json"></label><p id="review-state" role="status"></p>
<section id="review-content" hidden><h2 id="review-title"></h2><textarea id="review-text" aria-label="Manuscript text" readonly rows="14" cols="70" style="max-width:100%"></textarea>
<form id="review-feedback"><label>Your name <input id="reviewer" required maxlength="100"></label><label>Feedback <textarea id="feedback" required maxlength="5000" rows="5"></textarea></label><button type="submit">Download feedback</button></form></section>
</main></body></html>
