<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; worker-src 'self'; style-src 'self' 'unsafe-inline'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>PDF Tools · Lumina Docs</title>
  <style>
    :root { color-scheme: light dark; font-family: system-ui,sans-serif; color: #19213b; background: #f3f5ff; --surface: #fff; --line:#b1bbd3; --accent:#4338ca; }
    * { box-sizing: border-box; }
    body { margin: 0; }
    main { max-width: 46rem; margin: 0 auto; padding: clamp(1rem,5vw,3rem); }
    h1 { margin-bottom: .25rem; }
    p { line-height: 1.55; }
    a { color: inherit; }
    form { background: var(--surface); border: 1px solid var(--line); border-radius: 1rem; padding: clamp(1rem,4vw,2rem); display: grid; gap: 1rem; }
    label { display: grid; gap: .4rem; font-weight: 600; }
    input, select, button, .result-link { min-height: 44px; font: inherit; padding: .55rem .7rem; border-radius: .4rem; border: 1px solid var(--line); width: 100%; }
    input, select { background: var(--surface); color: inherit; }
    button, .result-link { background: var(--accent); color: #fff; font-weight: 650; cursor: pointer; }
    button:disabled { opacity: .65; cursor: wait; }
    [hidden] { display: none !important; }
    #page-help, #file-order, #status { margin: 0; overflow-wrap: anywhere; }
    #result { display: flex; flex-wrap: wrap; gap: .7rem; }
    .result-link { display: inline-flex; align-items: center; width: auto; }
    :focus-visible { outline: 3px solid #a86800; outline-offset: 3px; }
    @media (prefers-color-scheme: dark) {
      :root { color:#edf0ff; background:#13172a; --surface:#1e2540; --line:#7182aa; --accent:#5548dd; }
    }
  </style>
  <script src="./vendor/pdf-lib-1.17.1.min.js" defer></script>
  <script src="./vendor/jszip-3.10.1.min.js" defer></script>
  <script src="./library-store.js" defer></script>
  <script src="./pdf-tools.js" defer></script>
  <link rel="stylesheet" href="./lumina-design.css">
  <script src="./vendor/lucide-1.79.0.min.js" defer></script>
  <script src="./lumina-design.js" defer></script>
</head>
<body class="lumina-app lumina-pdf">
<header class="lumina-shell">
  <div class="lumina-shell-inner">
    <a class="lumina-brand" href="./workspace.html"><span class="lumina-mark" aria-hidden="true">L</span>Lumina Docs</a>
    <nav class="lumina-nav" aria-label="App navigation">
      <a href="./workspace.html"><i data-lucide="layout-grid" aria-hidden="true"></i>Workspace</a>
      <a href="./index.html"><i data-lucide="file-text" aria-hidden="true"></i>Docs</a>
      <a href="./slides.html"><i data-lucide="presentation" aria-hidden="true"></i>Slides</a>
      <a href="./pdf-tools.html" aria-current="page"><i data-lucide="files" aria-hidden="true"></i>PDF Tools</a>
    </nav>
  </div>
</header>
<main class="pdf-screen">
  <section class="pdf-intro" aria-labelledby="pdf-title">
    <h1 id="pdf-title" class="screen-title">PDF Tools</h1>
    <p class="screen-intro">Combine documents, manage pages, or convert images. Processing happens on this device.</p>
    <a id="page-organizer" class="pdf-shortcut" href="./organize-pdf.html"><i data-lucide="layout-grid" aria-hidden="true"></i>Open visual page organizer</a>
  </section>
  <form id="pdf-form">
    <label>Tool
      <select id="operation">
        <optgroup label="Organize">
          <option value="merge">Merge PDFs</option>
          <option value="extract">Extract or reorder pages</option>
          <option value="split">Split into one-page PDFs (ZIP)</option>
          <option value="remove">Delete pages</option>
          <option value="rotate">Rotate pages</option>
          <option value="crop">Crop page margins</option>
        </optgroup>
        <optgroup label="Edit and view">
          <option value="watermark">Add a text watermark</option>
          <option value="number">Add page numbers</option>
          <option value="flatten">Flatten form fields</option>
          <option value="view">Open PDF viewer</option>
        </optgroup>
        <optgroup label="Security">
          <option value="unlock">Remove PDF password</option>
        </optgroup>
        <optgroup label="Convert">
          <option value="images">JPG / PNG to PDF</option>
          <option value="text">Plain text to PDF</option>
        </optgroup>
      </select>
    </label>
    <label id="file-label"><span id="file-caption">PDF files</span><input id="files" type="file" accept=".pdf,application/pdf" required multiple></label>
    <p id="file-order" hidden></p>
    <label id="page-controls" hidden>Pages
      <input id="pages" type="text" placeholder="Example 1, 3-5" aria-describedby="page-help">
      <span id="page-help">Leave blank to use every page.</span>
    </label>
    <label id="rotate-controls" hidden>Rotation
      <select id="angle"><option value="90">90° clockwise</option><option value="180">180°</option><option value="270">90° counterclockwise</option></select>
    </label>
    <label id="crop-controls" hidden>Trim from each edge (points)
      <input id="margin" type="number" min="1" max="1000" value="36">
      <span>Crop changes what is visible. The underlying content remains in the file.</span>
    </label>
    <label id="watermark-controls" hidden>Watermark text
      <input id="watermark" type="text" maxlength="100">
    </label>
    <label id="password-controls" hidden>Current PDF password
      <input id="password" type="password" autocomplete="off" aria-describedby="password-help">
      <span id="password-help">Use the password for a PDF you have permission to unlock. The downloaded copy will open without a password. The tool downloads its processing engine when needed.</span>
    </label>
    <button id="run" type="submit">Process files</button>
    <p id="status" role="status"></p>
    <div id="result" hidden>
      <a id="download" class="result-link">Download result</a>
      <a id="open" class="result-link" target="_blank" rel="noopener">Open PDF</a>
    </div>
  </form>
</main>
</body>
</html>
